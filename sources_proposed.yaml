  - name: "Séminaire Poincaré / Bourbaphy"
    class_considered: A
    reason: "физика, не математика — подтверждено на bourbaphy.fr ('Bourbaphy' = Bourbaki+physique). Дубль-риск с уже собранным Bourbaki отсутствует (разные дисциплины), но вне профиля дайджеста."

  - name: "PCMI (Park City Mathematics Institute) / IHÉS Summer School"
    class_considered: A
    reason: "технические многонедельные минкурсы для аспирантов, не отдельные широко-аудиторные лекции; чистого линкуемого фида отдельных докладов не нашлось — только плейлисты по темам/годам."

  - name: "SLMath / MSRI Public Lectures"
    class_considered: A
    reason: "серия 'MSRI/Evans Lecture' не имеет подтверждений активности после ~2014; текущий видеоархив стал устаревшим (1995-1997), актуальный листинг не найден несмотря на несколько попыток."

  - name: "Fields Institute Public Lectures"
    class_considered: A
    reason: "серия существует в принципе (Distinguished/Coxeter Lectures), но не удалось получить ни одного реального 2023-2025 примера title+дата+рабочая ссылка — страницы либо не рендерятся, либо выдают устаревший контент."

  - name: "ICM Public Lecture (Philadelphia 2026)"
    class_considered: A
    reason: "реальна и подтверждена (Terence Tao 2026-07-24, Talithia Williams 2026-07-25 через Eventbrite/Simons Foundation), но раз в 4 года по циклу конгресса — не регулярный поток; не включена ради дисциплины «не перегружать», отмечена как резерв."

  - name: "Simons Foundation Presidential Lectures / Simons Institute (Karp Lectures, Theoretically Speaking)"
    class_considered: A
    reason: "реальны, но математико-релевантная доля мала (1-3/год из Presidential Lectures; Karp/Theoretically Speaking по духу больше CS-theory, чем чистая математика). Не включены ради дисциплины «не перегружать» — держать в резерве, если Clay/Abel/Breakthrough/Snapshots/Oberwolfach окажется мало."

  - name: "Peter Cameron's Blog (теория представлений — доп. к Persiflage)"
    class_considered: B
    reason: "смежная область (группы/комбинаторика), не узко теория представлений; регулярной рубрики по теме нет. Раздел теория представлений остаётся пробелом."

  - name: "Étienne Ghys (differentional geometry / dynamics)"
    class_considered: B
    reason: "живой еженедельный подкаст 'Petites histoires de science' существует, но контент общенаучный (история науки), не специфично дифгеометрия/динамика. Письменные геометрические статьи на images.math.cnrs.fr выходят ~1/год — недостаточный поток. Оба раздела (дифгеометрия, динамические системы) остаются пробелами."

  - name: "Vaughn Climenhaga's Math Blog (динамические системы)"
    class_considered: B
    reason: "мёртв с 2022-06-24 — не проходит по свежести."

  - name: "Andrew Gelman — Statistical Modeling blog (вторичный кандидат по вероятности/статистике)"
    class_considered: B
    reason: "огромный охват, но контент смещён в соц.науки/политику/методологическую критику, а не мост к теории вероятностей. John D. Cook точнее попадает в профиль — Gelman не включён во избежание перегрузки."

