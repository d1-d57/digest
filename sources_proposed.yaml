rejected:
  - name: "Gazette de la Société Mathématique de France (ex-Gazette des Mathématiciens, SMF)"
    class_considered: C
    reason: >
      Жива и активна (номера 185-188, juillet 2025 - avril 2026, реальное содержание
      подтверждено через smf.emath.fr/publications/... с полным оглавлением: статьи,
      "Raconte-moi..." и др.), НО полный текст статей недоступен без покупки/членства —
      публично доступен только 5-страничный PDF-сэмпл (обложка+редколлегия) на номер;
      "OPEN ACCESS" кнопка требует ввода email в форму (сбор email для рассылки) —
      не делали, так как это отправка формы без явного разрешения пользователя.
      Даже аннотаций к статьям нет в открытом доступе, только заголовки/авторы/страницы —
      честно оценить гейты по одному заголовку невозможно. gazette.smf.emath.fr (старый
      поддомен) вообще не резолвится (NXDOMAIN) — сайт переехал на smf.emath.fr.

  - name: "La Gaceta de la RSME"
    class_considered: C
    reason: >
      Жива и активна (Vol. 29 №1-2 2026, Vol. 28 №2-3 2025, богатое оглавление с DOI
      через gaceta.rsme.es — напр. «Los castores en el límite de la computación»,
      «yamátárájabhánasalagám: El ritmo de las sucesiones de De Bruijn», «La conjetura
      de McKay», «Dualidad de Stone y espacios profinitos» — темы отличные), НО каждая
      статья требует логина (abrir.php?id=... → редирект на login.php); сайт сам
      заявляет "acceso libre gratuito a números de más de dos años" — то есть весь
      наш годовой промежуток (2025-07..2026-07) системно за платным доступом/членством
      РСМЕ. Абстрактов тоже нет в открытом доступе — только заголовок/автор/DOI/страницы.
      Стоит пересмотреть через 1-2 года, когда номера 2025-2026 выйдут из эмбарго.

  - name: "Pour la Science (+ La Recherche, мат-колонки)"
    class_considered: C
    reason: >
      Pour la Science: подтверждена активность через сторонние индексы (Images des
      Mathématiques revue de presse упоминает статьи pourlascience.fr, включая
      "Un tétraèdre stable à une seule face" дек.2025 и продолжающуюся колонку
      Jean-Paul Delahaye "Logique et calcul" в номерах 579-584/2026), НО сайт технически
      непроходим для анонимного доступа: и категорийные страницы (/sr/mathematiques/),
      и отдельные статьи уходят в бесконечный редирект-цикл через sso.qiota.com
      (error=bad_credential) — не отдаёт даже meta-описание/абстракт. site: в WebSearch
      для pourlascience.fr заблокирован ("not accessible to our user agent").
      La Recherche: сайт (larecherche.fr) грузится напрямую, но дежурной мат-рубрики
      на главной/в меню не нашлось (акцент на энергетику/ИИ/биологию/медицину), а
      поиск по домену тоже заблокирован для WebSearch — не удалось подтвердить ни
      одной живой мат-статьи в окне. Оба требуют либо ручной подписки/логина, либо
      повторной попытки другим методом (напр. через партнёрский агрегатор Cairn/Europresse).

