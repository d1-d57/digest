{{ define "main" }}
<div class=kick>{{ .Params.kick }}</div>

<div class=author>Ваня Яковлев · <a href="https://t.me/turings_crossword" target=_blank rel=noopener>«Кроссворд Тьюринга»</a></div>

<div class=list>
{{ range hugo.Data.vypuski }}
<div class=row>

    <p>{{ .opisanie }}</p>
  </div>
</div>
{{ end }}
</div>
{{ end }}
