# Сборка дайджеста и публикация на GitHub Pages.
#
# Версия Hugo прибита гвоздём намеренно: сайт должен собираться одинаково
# и сегодня, и через год. Обновлять — руками, отдельным решением.
name: Сборка и публикация сайта

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Поставить Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Выкачать репозиторий
        uses: actions/checkout@v4
      - name: Спросить у Pages базовый адрес
        id: pages
        uses: actions/configure-pages@v5
      - name: Собрать
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Отдать собранное
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
